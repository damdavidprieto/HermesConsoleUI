name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck
          Get-Module -Name Pester -ListAvailable
      
      - name: Run Unit Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Unit'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './src/**/*.ps1', './src/**/*.psm1'
          $config.CodeCoverage.OutputPath = './coverage.xml'
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          
          Invoke-Pester -Configuration $config
      
      - name: Run Integration Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Integration'
          $config.Run.Exit = $false
          $config.Output.Verbosity = 'Detailed'
          
          Invoke-Pester -Configuration $config
        continue-on-error: true
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: hermesconsoleui-coverage
        continue-on-error: true
      
      - name: Generate Coverage Report
        shell: pwsh
        run: |
          if (Test-Path ./coverage.xml) {
            Write-Host "✅ Coverage report generated successfully"
            Write-Host "📊 Upload to Codecov for detailed analysis"
          } else {
            Write-Host "⚠️ No coverage report found"
          }
